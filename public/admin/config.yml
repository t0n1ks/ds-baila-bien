# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Sveltia CMS — the human-friendly layer on top of the files in src/content/.
# Editing those JSON files straight in the GitHub web UI keeps working
# regardless of whether this admin is set up.
#
# Sign in at https://t0n1ks.github.io/ds-baila-bien/admin/
#   - "Sign In with Token": paste a GitHub personal access token (fine-grained,
#     repo ds-baila-bien, Contents: read & write). Works with zero extra setup.
#   - Multi-user OAuth (optional, later): deploy sveltia/sveltia-cms-auth as a
#     Cloudflare Worker, create a GitHub OAuth App, then add under `backend`:
#       base_url: https://<your-worker>.workers.dev
#
# Layout: each sidebar entry owns exactly one file, so saving one entry can
# never drop another entry's keys.
#   Galerie       → src/content/gallery.json    media once, caption DE + EN per item
#   Events        → src/content/events.json     flyer once, caption DE + EN
#   Instagram     → src/content/instagram.json  profile + post cards once, captions DE + EN
#   Deutsch       → src/content/de.json         every other German text
#   English       → src/content/en.json         every other English text
#   Einstellungen → src/content/site.json       brand, logos, e-mail, maps link, theme
# Deutsch and English use the SAME field list (npm run check:content enforces
# it). Every key in those files must be declared here, otherwise the CMS
# strips it on save. Rarely-touched UI strings sit in collapsed groups.

backend:
  name: github
  repo: t0n1ks/ds-baila-bien
  branch: main

site_url: https://t0n1ks.github.io/ds-baila-bien/
# Uploads are committed straight into the repo (default GitHub storage — no
# external media library). media_folder is the repo path the file lands in;
# public_folder is the path written into the JSON. The site prefixes it
# with the Pages base (see asset() in src/config.js), so "/images/uploads/x.jpg"
# is served from /ds-baila-bien/images/uploads/x.jpg.
media_folder: public/images/uploads
public_folder: /images/uploads

# Sveltia sends the file base64-encoded inside one GitHub API request. Big
# files (phone photos, long clips) make that request time out, and the browser
# only reports "Failed to fetch". So: shrink photos in the browser before the
# upload (WebP, max 2000 px) and refuse anything over 8 MB up front.
media_libraries:
  default:
    config:
      max_file_size: 8000000
      slugify_filename: true
      transformations:
        raster_image:
          format: webp
          quality: 82
          width: 2000
          height: 2000

singletons:
  # ---------------------------------------------------------------------------
  - name: gallery
    label: Galerie
    icon: photo_library
    file: src/content/gallery.json
    fields:
      - name: items
        label: Medien
        widget: list
        hint: >-
          Gilt für beide Sprachen. Zum Sortieren ziehen. Die Bildunterschrift dient
          auch als Alternativtext. Überschrift und Einleitung der Galerie stehen
          unter „Deutsch“ / „English“.
        fields:
          - { name: type, label: Typ, widget: select, options: [image, video] }
          - { name: src, label: Datei, widget: file, accept: 'image/jpeg,image/png,image/webp,video/mp4,video/webm', hint: 'Bild oder kurzes Video, max. ca. 8 MB' }
          - name: caption
            label: Bildunterschrift
            widget: object
            fields:
              - { name: de, label: Bildunterschrift (Deutsch), widget: string }
              - { name: en, label: Caption (English), widget: string }

  # ---------------------------------------------------------------------------
  - name: events
    label: Events
    icon: event
    file: src/content/events.json
    fields:
      - name: media
        label: Flyer (Bild oder Video)
        hint: >-
          Gilt für beide Sprachen. Ohne Bild/Video wird der ganze Abschnitt
          ausgeblendet. JPG, PNG, WEBP oder ein kurzes MP4/WEBM-Video, max. ca. 8 MB.
          Überschrift und Link-Text stehen unter „Deutsch“ / „English“.
        widget: file
        accept: 'image/jpeg,image/png,image/webp,video/mp4,video/webm'
        required: false
      - name: url
        label: Link zum Event / Instagram-Beitrag
        widget: string
        required: false
      - name: caption
        label: Bildunterschrift
        hint: Optional — beide Sprachen ausfüllen oder beide leer lassen.
        widget: object
        fields:
          - { name: de, label: Bildunterschrift (Deutsch), widget: string, required: false }
          - { name: en, label: Caption (English), widget: string, required: false }

  # ---------------------------------------------------------------------------
  - name: instagram
    label: Instagram
    icon: photo_camera
    file: src/content/instagram.json
    fields:
      - name: profileUrl
        label: Instagram-Profil (URL)
        widget: string
        hint: >-
          Gilt für beide Sprachen, ebenso die Karten unten. Überschrift und Texte
          des Abschnitts stehen unter „Deutsch“ / „English“.
      - { name: handle, label: Instagram-Handle, widget: string, hint: 'z. B. @baila_bien.mz' }
      - name: posts
        label: Instagram-Karten
        hint: >-
          Pro Karte ein eigenes Bild oder kurzes Video hochladen und die Adresse
          des Beitrags einfügen. Zum Sortieren ziehen.
        widget: list
        allow_add: true
        summary: '{{fields.url}}'
        fields:
          - name: media
            label: Bild oder Video
            hint: >-
              JPG, PNG, WEBP oder ein kurzes MP4/WEBM-Video. Max. ca. 8 MB —
              Videos bitte kurz halten (ca. 5–15 Sekunden). Fotos werden
              automatisch verkleinert.
            widget: file
            accept: 'image/jpeg,image/png,image/webp,video/mp4,video/webm'
            required: false
          - name: url
            label: Link zum Beitrag
            hint: 'z. B. https://www.instagram.com/p/XXXXXXXXXXX/'
            widget: string
          - name: caption
            label: Bildunterschrift
            hint: Optional — beide Sprachen ausfüllen oder beide leer lassen.
            widget: object
            fields:
              - { name: de, label: Bildunterschrift (Deutsch), widget: string, required: false }
              - { name: en, label: Caption (English), widget: string, required: false }

