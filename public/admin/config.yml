                    fields:
                      - { name: id, label: Section id, widget: string }
                      - { name: label, label: Label, widget: string }
                  - { name: logoLabel, label: 'Aria: logo', widget: string }
                  - { name: backToTop, label: 'Aria: back to top', widget: string }
                  - { name: menuOpen, label: 'Aria: open menu', widget: string }
                  - { name: menuClose, label: 'Aria: close menu', widget: string }
                  - { name: themeLabel, label: 'Aria: theme', widget: string }
                  - { name: langLabel, label: 'Aria: language', widget: string }
                  - { name: skipToContent, label: Skip link, widget: string }

              - name: hero
                label: Hero
                widget: object
                fields:
                  - { name: eyebrow, label: Small text above, widget: string }
                  - { name: wordmark, label: Large wordmark (2 words), widget: list, field: { name: word, label: Word, widget: string } }
                  - { name: title, label: Headline, widget: string }
                  - { name: subtitle, label: Subtitle, widget: text }
                  - { name: cta, label: Primary button, widget: string }
                  - { name: secondaryCta, label: Secondary button, widget: string }

              - name: marquee
                label: Marquee
                widget: list
                field: { name: word, label: Term, widget: string }

              - name: about
                label: About
                widget: object
                fields:
                  - { name: heading, label: Heading, widget: string }
                  - { name: text, label: Text, widget: text }
                  - name: stats
                    label: Big numbers
                    widget: list
                    fields:
                      - { name: value, label: Value, widget: string }
                      - { name: label, label: Description, widget: string }

              - name: classes
                label: Classes
                widget: object
                fields:
                  - { name: heading, label: Heading, widget: string }
                  - { name: intro, label: Intro, widget: text }
                  - { name: location, label: Location, widget: string }
                  - { name: locationNote, label: Location note, widget: string }
                  - { name: mapsLabel, label: Maps link text, widget: string }
                  - { name: day, label: Day, widget: string }
                  - { name: timeColumn, label: 'Column: time', widget: string }
                  - name: rows
                    label: Schedule
                    widget: list
                    fields:
                      - { name: time, label: Time, widget: string }
                      - { name: label, label: Programme, widget: string }

              - name: prices
                label: Prices
                widget: object
                fields:
                  - { name: heading, label: Heading, widget: string }
                  - { name: note, label: Note, widget: string }
                  - { name: footnote, label: Footnote, widget: string }
                  - { name: levelColumn, label: 'Column: level', widget: string }
                  - { name: priceColumn, label: 'Column: price', widget: string }
                  - { name: reducedColumn, label: 'Column: reduced', widget: string }
                  - name: rows
                    label: Price table
                    widget: list
                    fields:
                      - { name: level, label: Level, widget: string }
                      - { name: price, label: Price, widget: string }
                      - { name: reduced, label: Reduced, widget: string }

              - name: gallery
                label: Gallery
                widget: object
                fields:
                  - { name: heading, label: Heading, widget: string }
                  - { name: intro, label: Intro, widget: string }
                  - { name: placeholder, label: Placeholder text, widget: string }
                  - { name: prev, label: 'Aria: previous image', widget: string }
                  - { name: next, label: 'Aria: next image', widget: string }
                  - { name: slideLabel, label: 'Aria: image (dots)', widget: string }
                  - name: items
                    label: Media
                    widget: list
                    fields:
                      - { name: type, label: Type, widget: select, options: [image, video] }
                      - { name: src, label: File, widget: image }
                      - { name: caption, label: Caption, widget: string }

              - name: instagram
                label: Instagram
                widget: object
                fields:
                  - { name: heading, label: Heading, widget: string }
                  - { name: intro, label: Intro, widget: text }
                  - { name: loadButton, label: 'Button "load post"', widget: string }
                  - { name: privacyNote, label: Privacy note, widget: text }
                  - { name: placeholder, label: Placeholder text, widget: string }
                  - { name: embedTitle, label: 'Aria: embedded post', widget: string }
                  - { name: profileLink, label: Profile link text, widget: string }
                  - { name: prev, label: 'Aria: previous post', widget: string }
                  - { name: next, label: 'Aria: next post', widget: string }
                  - { name: slideLabel, label: 'Aria: post (dots)', widget: string }

              - name: form
